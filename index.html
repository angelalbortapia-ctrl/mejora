  <script>
    try {
      const MEJORA_ASSET_V = 194
      const root = document.documentElement
      root.dataset.notionLight = '1'
      root.classList.remove('dark')
      root.removeAttribute('data-theme')
      root.style.colorScheme = 'light'
      root.style.backgroundColor = '#ffffff'
      root.style.setProperty('--bg-app', '#ffffff')
      root.style.setProperty('--bg-sidebar', '#f7f6f3')
      root.style.setProperty('--bg-card', '#ffffff')
      root.style.setProperty('--m-bg', '#ffffff')
      root.style.setProperty('--m-surface', '#ffffff')
      root.style.setProperty('--m-surface-2', '#fbfbfa')
      root.style.setProperty('--m-text', '#37352f')
      root.style.setProperty('--m-muted', '#9b9a97')
      root.style.setProperty('--m-accent', '#2383e2')
      root.style.setProperty('--text-main', '#37352f')
      root.style.setProperty('--sidebar-bg', '#f7f6f3')
      document.addEventListener('DOMContentLoaded', () => {
        document.body.style.backgroundColor = '#ffffff'
        document.body.style.color = '#37352f'
        document.body.classList.remove('theme-rpg')
      })
      const s = JSON.parse(localStorage.getItem('mejora_settings') || 'null')
      if (s) {
        if (s.darkMode) s.darkMode = false
        if (s.theme && s.theme !== 'default') s.theme = 'default'
        if (s.reducedMotion) root.classList.add('reduce-motion')
        localStorage.setItem('mejora_settings', JSON.stringify(s))
      }
      const prevV = localStorage.getItem('mejora_asset_v')
      const purge = !prevV || prevV !== String(MEJORA_ASSET_V)
      localStorage.setItem('mejora_asset_v', String(MEJORA_ASSET_V))
      if (purge && 'caches' in window) {
        caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
      }
      if (purge && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) =>
          Promise.all(regs.map((reg) => reg.unregister()))
        )
      }
    } catch (_) {}
  </script>

  <style id="mejora-notion-light-critical">
    html,
    html body,
    html body.mejora-forge,
    html[data-notion-light="1"],
    html[data-notion-light="1"] body,
    html[data-notion-light="1"] body.mejora-forge {
      color-scheme: light !important;
      background: #ffffff !important;
      color: #37352f !important;
    }
    html .app-shell,
    html .app-main,
    html .app-content,
    html #app-content,
    html .app-banner,
    html .bottom-nav,
    html[data-notion-light="1"] .app-shell,
    html[data-notion-light="1"] .app-main,
    html[data-notion-light="1"] .app-content,
    html[data-notion-light="1"] #app-content,
    html[data-notion-light="1"] .app-banner,
    html[data-notion-light="1"] .bottom-nav {
      background-color: #ffffff !important;
      background-image: none !important;
      color: #37352f !important;
    }
    html .sidebar,
    html .sidebar-nav,
    html[data-notion-light="1"] .sidebar,
    html[data-notion-light="1"] .sidebar-nav {
      background-color: #f7f6f3 !important;
      border-right: 1px solid #e1dfdd !important;
      box-shadow: none !important;
    }
    html[data-notion-light="1"] .logo-mark {
      background: #2383e2 !important;
      color: #fff !important;
      -webkit-text-fill-color: #fff !important;
    }
    html[data-notion-light="1"] :is(
      .card, .m-section, .ds-panel, .habit-card, .m-coach-card,
      .brain-profile, .qa-card, .m-adaptive-mission, .m-shortcut
    ) {
      background-color: #ffffff !important;
      border: 1px solid #e1dfdd !important;
      color: #37352f !important;
      box-shadow: 0 1px 3px rgba(0,0,0,.04) !important;
    }
    html[data-notion-light="1"] :is(.m-home-title, .banner-title, .logo-text) {
      color: #37352f !important;
      text-shadow: none !important;
    }
    html[data-notion-light="1"] :is(.m-home-lead, .banner-subtitle, .sidebar-link) {
      color: #9b9a97 !important;
    }
    html[data-notion-light="1"] .btn-primary,
    html[data-notion-light="1"] .banner-cta {
      background: #2383e2 !important;
      color: #fff !important;
      border-color: #1a73c7 !important;
    }
    html[data-notion-light="1"] #fx-layer,
    html[data-notion-light="1"] body.mejora-forge::before {
      display: none !important;
      background: none !important;
    }
    html[data-notion-light="1"] .onboarding-overlay {
      background: rgba(255, 255, 255, 0.92) !important;
    }
    html[data-notion-light="1"] .onboarding-shell {
      background: #ffffff !important;
      color: #37352f !important;
      border-color: #e1dfdd !important;
    }

<body class="mejora-forge">
  <div id="fx-layer" aria-hidden="true"></div>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <a href="#/" class="sidebar-brand no-underline">
          <span class="logo-mark">M</span>
          <span class="font-display logo-text">Mejora</span>
        </a>
        <button type="button" id="sidebar-close" class="sidebar-close btn-ghost" aria-label="Cerrar menú">✕</button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Navegación principal"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-stats">
          <div class="sidebar-stats-row">
            <span id="sidebar-streak" class="sidebar-stat">—</span>
            <span id="sidebar-level" class="sidebar-stat">Nv.1</span>
          </div>
          <div class="progress-track sidebar-plan-track">
            <div id="sidebar-plan" class="progress-fill h-full" style="width:0%"></div>
          </div>
          <p class="sidebar-stats-caption">Plan del día</p>
        </div>
        <a href="#/ajustes" data-path="/ajustes" class="sidebar-link sidebar-link-settings no-underline">
          <span class="sidebar-link-icon" aria-hidden="true">⚙</span>
          <span class="sidebar-link-label">Ajustes</span>
        </a>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <div class="app-main">
      <header class="app-banner" id="app-banner">
        <div class="banner-glow" aria-hidden="true"></div>
        <div class="banner-inner">
          <div class="banner-start">
            <button type="button" id="sidebar-toggle" class="banner-menu btn-ghost" aria-label="Abrir menú">
              <span class="banner-menu-icon"></span>
            </button>
            <div class="banner-titles">
              <nav class="banner-breadcrumb" aria-label="Ubicación">
                <a href="#/" id="banner-section-link" class="banner-crumb banner-crumb-link no-underline">Hoy</a>
                <span class="banner-crumb-sep" aria-hidden="true">/</span>
                <span id="banner-page" class="banner-crumb banner-crumb-current">Inicio</span>
              </nav>
              <h1 id="page-title" class="banner-title font-display">Inicio</h1>
              <p id="page-subtitle" class="banner-subtitle">Resumen del día</p>
            </div>
          </div>

          <div class="banner-metrics">
            <div class="banner-metric banner-metric-plan">
              <div class="banner-metric-head">
                <span class="banner-metric-label">Plan del día</span>
                <span class="banner-metric-value" id="banner-plan-text">0/4</span>
              </div>
              <div class="banner-metric-track">
                <div id="banner-plan-bar" class="banner-metric-fill" style="width:0%"></div>
              </div>
            </div>
            <div class="banner-metric banner-metric-streak">
              <span class="banner-metric-icon" aria-hidden="true">🔥</span>
              <div>
                <span class="banner-metric-value" id="banner-streak-text">0</span>
                <span class="banner-metric-label">días racha</span>
              </div>
            </div>
            <div class="banner-metric banner-metric-weather" id="banner-weather-wrap">
              <span class="banner-metric-icon" id="banner-weather-icon" aria-hidden="true">☀</span>
              <div>
                <span class="banner-metric-value" id="banner-weather-temp">—</span>
                <span class="banner-metric-label" id="banner-weather-label">clima</span>
              </div>
            </div>
            <span id="banner-shield" class="banner-shield hidden" title="">🛡</span>
          </div>

          <div class="banner-end">
            <time id="banner-date" class="banner-date" datetime=""></time>
            <button type="button" class="btn-secondary banner-search-btn" onclick="document.getElementById('global-search-dialog')?.showModal()" aria-label="Buscar">⌕</button>
            <a href="#/plan" id="banner-cta" class="banner-cta btn-primary no-underline">Continuar plan</a>
            <a href="#/perfil" class="banner-avatar no-underline" id="banner-avatar" title="Perfil">
              <span id="banner-avatar-icon"></span>
            </a>
            <a href="#/ajustes" class="banner-icon-btn btn-ghost no-underline" title="Ajustes" aria-label="Ajustes">⚙</a>
          </div>
        </div>
      </header>
      <main id="app-content" class="app-content"></main>
    </div>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Acceso rápido"></nav>
  </div>

  <div id="onboarding-overlay" class="onboarding-overlay" aria-hidden="true"></div>
  <div id="tour-overlay" class="tour-overlay" aria-hidden="true"></div>
  <script>
    if (location.protocol === 'file:') {
      document.body.innerHTML = '<div style="max-width:28rem;margin:4rem auto;padding:2rem;font-family:system-ui;color:#ece8e3;background:#111"><h1 style="margin:0 0 1rem">Mejora necesita servidor local</h1><p style="color:#8a8480;line-height:1.5">No abras <code>index.html</code> directo. Doble clic en <strong>start-server.command</strong> o <strong>Mejora.app</strong>.</p><pre style="background:#1a1918;padding:1rem;border-radius:8px;overflow:auto">open ~/Downloads/Mejora/start-server.command</pre></div>'
    }
  </script>
  <script type="module">
    window.addEventListener('error', (e) => {
      if (!e.filename?.includes('/js/')) return
      const box = document.createElement('div')
      box.style.cssText = 'max-width:28rem;margin:2rem auto;padding:1.5rem;font-family:system-ui;color:#eceff4;background:#12161c;border:1px solid #3d4a5c;border-radius:8px'
      const detail = (e.message || 'Error desconocido').replace(/</g, '&lt;')
      const file = (e.filename || '').split('/').pop() || 'módulo JS'
      box.innerHTML = '<h2 style="margin:0 0 0.5rem">Mejora no pudo cargar</h2><p style="margin:0 0 0.75rem;line-height:1.5;color:#c45c5c"><strong>' + file + ':</strong> ' + detail + '</p><p style="margin:0 0 1rem;line-height:1.5;color:#8a8480">Recarga con <strong>Cmd+Shift+R</strong>. Abre con <strong>start-server.command</strong> (doble clic), no con python -m http.server.</p><pre style="background:#0a0c10;padding:0.75rem;border-radius:8px;overflow:auto">open ~/Downloads/Mejora/start-server.command</pre>'
      document.body.innerHTML = ''
      document.body.appendChild(box)
    })
  </script>
    <script type="importmap" src="/js/import-map.json?v=194"></script>
  <script type="module" src="/js/app.js?v=194"></script>
</body>
