<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0c10" />
  <meta name="description" content="Mejora — disciplina, hábitos, neurociencia y calma bajo presión." />
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('mejora_settings') || 'null')
      if (s && s.reducedMotion) document.documentElement.classList.add('reduce-motion')
    } catch (_) {}
  </script>
  <title>Mejora — Disciplina y rendimiento</title>
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
  <link rel="apple-touch-icon" href="public/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/utilities.css" />
  <link rel="stylesheet" href="css/design-system.css?v=78" />
  <link rel="stylesheet" href="css/forge.css?v=78" />
  <link rel="stylesheet" href="css/school.css?v=78" />
</head>
<body class="mejora-forge">
  <div id="fx-layer" aria-hidden="true"></div>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <a href="#/" class="sidebar-brand no-underline">
          <span class="logo-mark">M</span>
          <span class="font-display logo-text">Mejora</span>
        </a>
        <button type="button" id="sidebar-close" class="sidebar-close btn-ghost" aria-label="Cerrar menú">✕</button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Navegación principal"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-stats">
          <div class="sidebar-stats-row">
            <span id="sidebar-streak" class="sidebar-stat">—</span>
            <span id="sidebar-level" class="sidebar-stat">Nv.1</span>
          </div>
          <div class="progress-track sidebar-plan-track">
            <div id="sidebar-plan" class="progress-fill h-full" style="width:0%"></div>
          </div>
          <p class="sidebar-stats-caption">Plan del día</p>
        </div>
        <a href="#/ajustes" data-path="/ajustes" class="sidebar-link sidebar-link-settings no-underline">
          <span class="sidebar-link-icon" aria-hidden="true">⚙</span>
          <span class="sidebar-link-label">Ajustes</span>
        </a>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <div class="app-main">
      <header class="app-banner" id="app-banner">
        <div class="banner-glow" aria-hidden="true"></div>
        <div class="banner-inner">
          <div class="banner-start">
            <button type="button" id="sidebar-toggle" class="banner-menu btn-ghost" aria-label="Abrir menú">
              <span class="banner-menu-icon"></span>
            </button>
            <div class="banner-titles">
              <nav class="banner-breadcrumb" aria-label="Ubicación">
                <a href="#/" id="banner-section-link" class="banner-crumb banner-crumb-link no-underline">Hoy</a>
                <span class="banner-crumb-sep" aria-hidden="true">/</span>
                <span id="banner-page" class="banner-crumb banner-crumb-current">Inicio</span>
              </nav>
              <h1 id="page-title" class="banner-title font-display">Inicio</h1>
              <p id="page-subtitle" class="banner-subtitle">Resumen del día</p>
            </div>
          </div>

          <div class="banner-metrics">
            <div class="banner-metric banner-metric-plan">
              <div class="banner-metric-head">
                <span class="banner-metric-label">Plan del día</span>
                <span class="banner-metric-value" id="banner-plan-text">0/4</span>
              </div>
              <div class="banner-metric-track">
                <div id="banner-plan-bar" class="banner-metric-fill" style="width:0%"></div>
              </div>
            </div>
            <div class="banner-metric banner-metric-streak">
              <span class="banner-metric-icon" aria-hidden="true">🔥</span>
              <div>
                <span class="banner-metric-value" id="banner-streak-text">0</span>
                <span class="banner-metric-label">días racha</span>
              </div>
            </div>
            <div class="banner-metric banner-metric-weather" id="banner-weather-wrap">
              <span class="banner-metric-icon" id="banner-weather-icon" aria-hidden="true">☀</span>
              <div>
                <span class="banner-metric-value" id="banner-weather-temp">—</span>
                <span class="banner-metric-label" id="banner-weather-label">clima</span>
              </div>
            </div>
            <span id="banner-shield" class="banner-shield hidden" title="">🛡</span>
          </div>

          <div class="banner-end">
            <time id="banner-date" class="banner-date" datetime=""></time>
            <button type="button" class="btn-secondary banner-search-btn" onclick="document.getElementById('global-search-dialog')?.showModal()" aria-label="Buscar">⌕</button>
            <a href="#/plan" id="banner-cta" class="banner-cta btn-primary no-underline">Continuar plan</a>
            <a href="#/perfil" class="banner-avatar no-underline" id="banner-avatar" title="Perfil">
              <span id="banner-avatar-icon"></span>
            </a>
            <a href="#/ajustes" class="banner-icon-btn btn-ghost no-underline" title="Ajustes" aria-label="Ajustes">⚙</a>
          </div>
        </div>
      </header>
      <main id="app-content" class="app-content"></main>
    </div>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Acceso rápido"></nav>
  </div>

  <div id="onboarding-overlay" class="onboarding-overlay" aria-hidden="true"></div>
  <div id="tour-overlay" class="tour-overlay" aria-hidden="true"></div>
  <script>
    if (location.protocol === 'file:') {
      document.body.innerHTML = '<div style="max-width:28rem;margin:4rem auto;padding:2rem;font-family:system-ui;color:#ece8e3;background:#111"><h1 style="margin:0 0 1rem">Mejora necesita servidor local</h1><p style="color:#8a8480;line-height:1.5">No abras <code>index.html</code> directo. Usa <strong>Mejora.app</strong> o en terminal:</p><pre style="background:#1a1918;padding:1rem;border-radius:8px;overflow:auto">cd ~/Downloads/Mejora\npython3 -m http.server 5173</pre><p style="color:#8a8480">Luego abre <a href="http://localhost:5173" style="color:#c4a484">http://localhost:5173</a></p></div>'
    }
  </script>
  <script type="module">
    window.addEventListener('error', (e) => {
      if (!e.filename?.includes('/js/')) return
      const box = document.createElement('div')
      box.style.cssText = 'max-width:28rem;margin:2rem auto;padding:1.5rem;font-family:system-ui;color:#eceff4;background:#12161c;border:1px solid #3d4a5c;border-radius:8px'
      box.innerHTML = '<h2 style="margin:0 0 0.5rem">Mejora no pudo cargar</h2><p style="margin:0 0 1rem;line-height:1.5">Usa el servidor local (no abras index.html directo).</p><pre style="background:#0a0c10;padding:0.75rem;border-radius:8px;overflow:auto">cd ~/Downloads/Mejora\npython3 -m http.server 5173</pre>'
      document.body.innerHTML = ''
      document.body.appendChild(box)
    })
  </script>
  <script type="module" src="js/app.js?v=78"></script>
</body>
</html>
