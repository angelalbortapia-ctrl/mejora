<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mejora — reset caché</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fff; color: #37352f; padding: 2rem; max-width: 28rem; margin: 0 auto; }
  </style>
</head>
<body>
  <p id="status">Limpiando caché y service worker…</p>
  <script>
    (async () => {
      try {
        if ('caches' in window) {
          const keys = await caches.keys()
          await Promise.all(keys.map((k) => caches.delete(k)))
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations()
          await Promise.all(regs.map((r) => r.unregister()))
        }
        localStorage.removeItem('mejora_asset_v')
        document.getElementById('status').textContent = 'Listo. Redirigiendo…'
        location.replace('/?v=193#/')
      } catch (e) {
        document.getElementById('status').textContent = 'Error: ' + e.message
      }
    })()
  </script>
</body>
</html>
